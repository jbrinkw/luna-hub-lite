name: verify-full

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Run only one verify-full per ref; cancel older runs in flight.
concurrency:
  group: verify-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-full-no-supabase:
    name: verify-full (subset, no Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up Python (for Pi-side checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Deno (for Supabase edge fn checks)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Run the subset of verify:full that does NOT require a running Supabase
      # local stack. Steps that need it are gated locally via supabase_running
      # checks and skip cleanly. We run them individually so failures attribute
      # to a specific gate.
      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format:check
        run: pnpm format:check

      - name: test (vitest, all workspaces)
        run: pnpm test

      - name: deno check (supabase edge functions)
        run: bash scripts/verify/deno_check.sh

      - name: parity_assert (L2 self-test)
        run: |
          set -e
          out=$(python3 scripts/harness/parity_assert.py self-test --quiet 2>&1) || ec=$?
          if [ "${ec:-0}" -ne 1 ]; then
            echo "parity_assert self-test did not detect seeded deltas (exit $ec)"
            echo "$out"
            exit 1
          fi
          echo "parity_assert self-test: deltas detected (engine OK)"

      - name: cloud-invariants (skip without LIVE_SHELF_DB_PATH)
        run: bash scripts/verify/cloud-invariants.sh

      - name: invariant-monitor (deno test)
        working-directory: supabase/functions/invariant-monitor
        run: deno test

      - name: state-machine
        working-directory: apps/web
        run: npx vitest run src/__tests__/unit/state-machine/

      - name: splice-uniqueness
        run: bash scripts/verify/migration-splice-uniqueness.sh

      - name: schema-parity (skip without PI_DB_PATH)
        run: bash scripts/verify/pi-cloud-schema-parity.sh

      - name: migration-test-coverage
        run: bash scripts/verify/migration-test-coverage.sh

      - name: lint-coverage
        run: bash scripts/verify/lint-coverage.sh

      # NOTE: Steps that require a running Supabase local stack
      # (test:integration, test:db (pgTAP), test:e2e, harness, mutation_pair_gate)
      # do NOT run here. They are gated by the local pre-push hook; see
      # docs/process/no-bypass-policy.md for rationale + plan to add a Supabase
      # service to this workflow once Auth contention is reliably mitigable in
      # GH Actions runners.
