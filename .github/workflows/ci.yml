name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Unit + integration + e2e tests intentionally NOT run on GitHub.
  # Policy decision 2026-04-27: GitHub Actions is too slow for the
  # iteration loop (3-min Supabase boot + jest/vitest cold start per
  # push). Tests run locally via `pnpm verify:fast` (pre-push hook)
  # and `pnpm verify:full` (on demand / pre-merge). Keeping CI lean
  # to lint+typecheck means push is fast; the heavy assertions live
  # in the local pre-push gate where the developer (or agent) can't
  # bypass them via --no-verify without making it visible in commit
  # history. See docs/test-system-fix-plan.md for the verify:fast vs
  # verify:full split + pre-push hook design.

