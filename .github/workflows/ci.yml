name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Unit + integration test jobs removed 2026-04-22 — run them locally
  # (`pnpm test` / `pnpm test:integration` / `supabase test db`). CI spent
  # most of its wall-clock on ubuntu + pnpm + supabase setup for tests
  # that are fast locally, and the integration suite was flaky against
  # the live OpenFoodFacts API. The `lint` + `typecheck` jobs above stay
  # (clean-install catches missing deps and stale tsbuildinfo hides).
  # Drift, deploy, and nightly-audit workflows are unaffected.

