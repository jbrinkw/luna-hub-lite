name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # amondnet/vercel-action@v25 pinned vercel CLI 25.1.0; Vercel's API
      # now requires >= 47.2.2 and rejects the older client with "Vercel
      # CLI version is outdated." Direct CLI is also the pattern Vercel
      # documents for CI (pull → build → deploy --prebuilt), so env vars
      # are fetched once and build happens in CI, not on Vercel's side.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/mcp-worker

  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref btlfsxammjzkyluophgr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # --include-all: apply every local migration whose timestamp isn't
      # already present on remote, even if newer ones landed out-of-order.
      # Without this flag, any skipped/failed migration from an earlier
      # deploy becomes a blocking wall ("Found local migration files to be
      # inserted before the last migration on remote database"). Since we
      # never rewrite migration history and RLS-check every function,
      # include-all is the correct default for our monotonic migration flow.
      - run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: |
          supabase functions deploy analyze-product --no-verify-jwt
          supabase functions deploy walmart-scrape --no-verify-jwt
          supabase functions deploy shelf-ingest --no-verify-jwt
          supabase functions deploy livetrack-session --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
