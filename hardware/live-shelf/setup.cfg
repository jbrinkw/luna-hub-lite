# mutmut — Python mutation testing for the Pi server.
#
# Invoked via scripts/mutation/python.sh (see scripts/mutation/README.md).
# Run from this directory (hardware/live-shelf/). The `--related` mode of
# the driver script rewrites `paths_to_mutate` in place for the duration
# of the run; everything else in this file is the stable full-mode config.
#
# Scope rationale: full-mode starts narrow — only the files whose
# existing pytest coverage already passes the 40% break threshold.
# Initial measurements across the contract surface:
#
#   shelves.py             67.74%  PASS — included
#   cloud/outbox.py        43.22%  PASS — included
#   cloud/client.py         0.60%  (mostly no_tests — HTTP calls mocked)
#   config.py              16.75%  (env parsing not exercised at all branches)
#   handlers/brightness.py 27.00%  (session lifecycle under-tested)
#   handlers/weight.py     14.18%  (catch-all session lifecycle under-tested)
#   handlers/scale_events.py ~4300 LOC, thousands of mutants — gate in
#     sampled mode only until its test matrix is hardened
#
# Add files to `paths_to_mutate` as coverage burn-down raises their
# score past 40%. Sampled (`--related`) mode still works for ANY file
# under server/ regardless of this list — the short list only controls
# the `pnpm verify:mutation` nightly full-run scope.

[mutmut]
paths_to_mutate =
    server/shelves.py
    server/cloud/outbox.py

tests_dir =
    server/tests/

# also_copy — carried into the mutant sandbox alongside paths_to_mutate.
# We include the full server/ tree so `from server.x import y` resolves
# just like it does under normal pytest runs (conftest.py prepends the
# parent dir to sys.path).
also_copy =
    server/
    firmware/

do_not_mutate =
    server/tests/*
    server/**/tests/*
    server/__pycache__/*

# Keep pytest quiet and bail on first failure — a killed mutant is
# detected as soon as any test fails, so -x is a correctness-neutral
# speedup. no:cacheprovider avoids polluting mutant sandboxes with
# .pytest_cache dirs that confuse incremental runs.
#
# --ignore test_integration.py: the broad-system integration tests
# leak threads/db handles that segfault Python at interpreter exit when
# combined with other test files. They pass fine alone, and they don't
# add unique coverage of the mutation targets. Removing them is safe
# for the mutation gate; they still run in the regular pytest suite.
pytest_add_cli_args =
    -q
    -x
    --no-header
    -p
    no:cacheprovider
    --ignore=server/tests/test_integration.py
